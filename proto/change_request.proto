syntax = "proto3";
package clearshore;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_package = "com.clearshore.data.generated";
option java_outer_classname = "ChangeRequestProto";
option csharp_namespace = "GrpcRepositories.Generated";

// Stores change requests. Generic for news, media, country and reference changes (please)
service ChangeRequestData {

  // The .NET server sends status and requested_by. id and created_at are ignored
  // on the way in; the reply returns the saved request with both filled in :)
  
  rpc Create (ChangeRequest) returns (ChangeRequest);

  // Returns the requests that match the filters. A filter that is not set is not applied.
  rpc GetMany (GetManyChangeRequestsRequest) returns (ChangeRequestList);

  //takes id returns one request. NOT_FOUND = id does not exist.
  rpc GetSingle (ChangeRequestId) returns (ChangeRequest);

  rpc UpdateStatus (UpdateChangeRequestStatusRequest) returns (ChangeRequest); //RETURN (Pending → Returned)

   // Replaces the payload and status of one request.
  rpc Update (UpdateChangeRequestRequest) returns (ChangeRequest); //RESUBMIT (Returned → Pending)

    // Deletes req (after approve and after decline).
  rpc Delete (ChangeRequestId) returns (google.protobuf.Empty);

}

enum ChangeTarget {
  CHANGE_TARGET_UNSPECIFIED = 0;
  CHANGE_TARGET_NEWS = 1;
  CHANGE_TARGET_MEDIA = 2;
  CHANGE_TARGET_COUNTRY_DEPLOYMENT = 3;
  CHANGE_TARGET_REFERENCE_ADJUSTMENT = 4;
}

enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  CHANGE_TYPE_CREATE = 1;
  CHANGE_TYPE_UPDATE = 2;
  CHANGE_TYPE_DELETE = 3;
}

enum ChangeStatus {
  CHANGE_STATUS_UNSPECIFIED = 0; //nobody set it
  CHANGE_STATUS_PENDING = 1;
  CHANGE_STATUS_RETURNED = 2;
}

message ChangeRequest {
  int32 id = 1;
  ChangeTarget target_type = 2;
  ChangeType type = 3;
  optional int32 target_id = 4;
  optional string payload_json = 5;
  ChangeStatus status = 6;
  int32 requested_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ChangeRequestId {
  int32 id = 1;
}

// input of get many, field= filter
message GetManyChangeRequestsRequest {
  optional ChangeTarget target_type = 1;
  optional int32 target_id = 2;
  optional ChangeStatus status = 3;
  // Only the requests submitted by this user (MINEEE).
  optional int32 requested_by = 4;
}

message ChangeRequestList { //grpcs takes one, returns one, wrapped message
  repeated ChangeRequest items = 1; //repeated = list
}



message UpdateChangeRequestStatusRequest {
  int32 id = 1;
  ChangeStatus status = 2;
}

message UpdateChangeRequestRequest {
  int32 id = 1;
  string payload_json = 2;
  ChangeStatus status = 3;
}
