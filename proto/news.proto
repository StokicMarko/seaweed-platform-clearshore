syntax = "proto3";

package clearshore;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common.proto";

option java_package = "com.clearshore.data.generated";
option java_outer_classname = "NewsProto";
option csharp_namespace = "GrpcRepositories.Generated";

// Stores news items. Files are saved through FileData.Save before Create.
service NewsData {
  rpc GetMany (google.protobuf.Empty) returns (NewsList); //which in use

  // Repeating a source_request_id returns the existing item.
  rpc Create (CreateNewsRequest) returns (NewsItem); //APPROVAL
}

message MediaFile {
  string original_file_name = 1;
  string stored_file_name = 2;
  string content_type = 3;
}

message NewsItem {
  int32 id = 1;
  LocalizedText title = 2;
  LocalizedText text = 3;
  repeated MediaFile files = 4;
  google.protobuf.Timestamp published_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message NewsList {
  repeated NewsItem items = 1;
}

message CreateNewsRequest {
  LocalizedText title = 1;
  LocalizedText text = 2;
  repeated MediaFile files = 3; //0 to many
  int32 source_request_id = 4;  // Repeating a source_request_id returns the existing item.
}