syntax = "proto3";

package clearshore;

import "google/protobuf/timestamp.proto";
import "common.proto";
import "machine.proto";

option java_package = "com.clearshore.data.generated";
option java_outer_classname = "MediaProto";
option csharp_namespace = "GrpcRepositories.Generated";

service MediaData {
  rpc GetMany (GetManyMediaRequest) returns (MediaList);
  rpc GetSingle (MediaId) returns (Media);
  rpc ReadFile (MediaId) returns (stream FileChunk);
}

enum MediaType {
  MEDIA_TYPE_UNSPECIFIED = 0;
  MEDIA_TYPE_IMAGE = 1;
  MEDIA_TYPE_VIDEO = 2;
  MEDIA_TYPE_MODEL_3D = 3;
}

message Media {
  int32 id = 1;
  Machine machine = 2;
  MediaType media_type = 3;
  LocalizedText title = 4;
  LocalizedText description = 5;
  string original_file_name = 6;
  string content_type = 7;
  google.protobuf.Timestamp published_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetManyMediaRequest {
  optional string machine_code = 1;
}

message MediaId {
  int32 id = 1;
}

message MediaList {
  repeated Media items = 1;
}

message FileChunk {
  bytes data = 1;
}
